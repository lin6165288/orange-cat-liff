<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>橘貓代購會員中心</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
  <h1>🧡 橘貓代購會員中心</h1>

  <div id="status">載入中...</div>

  <div id="memberArea" style="display:none;">
    <h2>會員資料</h2>
    <p id="memberInfo"></p>
    <a href="https://jumao-check-upf47j7ylvkkgaq9u7nxoa.streamlit.app">前往訂單查詢系統</a>
  </div>

  <div id="bindArea" style="display:none;">
    <p>請輸入你登記包裹時使用的名稱，完成 LINE 綁定。</p>
    <input id="customerName" type="text" placeholder="例如：王小明" />
    <button onclick="bindLine()">立即綁定</button>
    <div id="bindStatus"></div>
  </div>

  <script>
    const LIFF_ID = "2010286756-yeXtJpY6";

    let lineUserId = "";
    let lineName = "";

    async function main() {
      const status = document.getElementById("status");

      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      lineUserId = profile.userId;
      lineName = profile.displayName;

      status.innerHTML = "LINE 登入成功：" + lineName;

      checkMember();
    }

    async function checkMember() {
      const res = await fetch("/api/get-member", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          line_user_id: lineUserId
        })
      });

      const result = await res.json();

      if (result.success && result.bound) {
        const m = result.member;

        document.getElementById("bindArea").style.display = "none";
        document.getElementById("memberArea").style.display = "block";

        document.getElementById("memberInfo").innerHTML =
          "包裹名稱：" + m.customer_name + "<br>" +
          "會員等級：" + m.member_level + "<br>" +
          "儲值餘額：" + m.balance + "<br>" +
          "累積儲值：" + m.total_recharge + "<br>" +
          "LINE 名稱：" + m.line_name;

      } else {
        document.getElementById("bindArea").style.display = "block";
      }
    }

    async function bindLine() {
      const customerName = document.getElementById("customerName").value.trim();
      const bindStatus = document.getElementById("bindStatus");

      if (!customerName) {
        bindStatus.innerHTML = "請先輸入包裹名稱。";
        return;
      }

      bindStatus.innerHTML = "綁定中...";

      const response = await fetch("/api/bind-line", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          customer_name: customerName,
          line_user_id: lineUserId,
          line_name: lineName
        })
      });

      const result = await response.json();

      if (result.success && result.affectedRows === 1) {
        bindStatus.innerHTML = "✅ 綁定成功，正在載入會員資料...";
        checkMember();
      } else {
        bindStatus.innerHTML = "❌ 綁定失敗，請確認名稱是否正確。";
      }
    }

    main();
  </script>
</body>
</html>
