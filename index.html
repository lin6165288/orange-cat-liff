<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>橘貓代購會員中心</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #fff7f0;
      color: #2f3340;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 24px;
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      box-sizing: border-box;
      margin-top: 10px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: none;
      background: #ff8a3d;
      color: white;
      font-weight: bold;
    }

    .status {
      line-height: 1.7;
      word-break: break-all;
    }

    .order {
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 12px;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f3f3f3;
      margin-right: 4px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🧡 橘貓代購會員中心</h1>
    <div id="status" class="status">載入中...</div>
  </div>

  <div id="memberArea" class="card" style="display:none;">
    <h2>會員資料</h2>
    <div id="memberInfo"></div>
    <button onclick="loadOrders('unreturned')">📦 查看未運回訂單</button>
    <button onclick="loadOrders('all')">📋 查看全部訂單</button>
  </div>

  <div id="ordersArea" class="card" style="display:none;">
    <h2>我的訂單</h2>
    <div id="ordersInfo">載入中...</div>
  </div>

  <div id="bindArea" class="card" style="display:none;">
    <p>請輸入你登記包裹時使用的名稱，完成 LINE 綁定。</p>
    <input id="customerName" type="text" placeholder="例如：王小明" />
    <button onclick="bindLine()">立即綁定</button>
    <div id="bindStatus" class="status"></div>
  </div>

  <script>
    const LIFF_ID = "2010286756-yeXtJpY6";

    let lineUserId = "";
    let lineName = "";
    let currentCustomerName = "";

    async function main() {
      const status = document.getElementById("status");

      try {
        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUserId = profile.userId;
        lineName = profile.displayName;

        status.innerHTML = "你好，" + lineName + " 🐾";

        checkMember();

      } catch (err) {
        status.innerHTML = "LIFF 發生錯誤：" + err.message;
      }
    }

    async function checkMember() {
      const res = await fetch("/api/get-member", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          line_user_id: lineUserId
        })
      });

      const result = await res.json();

      if (result.success && result.bound) {
        const m = result.member;
        currentCustomerName = m.customer_name;

        document.getElementById("bindArea").style.display = "none";
        document.getElementById("memberArea").style.display = "block";

        document.getElementById("memberInfo").innerHTML =
          "包裹名稱：" + m.customer_name + "<br>" +
          "會員等級：" + m.member_level + "<br>" +
          "LINE 名稱：" + m.line_name;

      } else {
        document.getElementById("bindArea").style.display = "block";
      }
    }

    async function bindLine() {
      const customerName = document.getElementById("customerName").value.trim();
      const bindStatus = document.getElementById("bindStatus");

      if (!customerName) {
        bindStatus.innerHTML = "請先輸入包裹名稱。";
        return;
      }

      bindStatus.innerHTML = "綁定中...";

      const response = await fetch("/api/bind-line", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          customer_name: customerName,
          line_user_id: lineUserId,
          line_name: lineName
        })
      });

      const result = await response.json();

      if (result.success && result.affectedRows === 1) {
        bindStatus.innerHTML = "✅ 綁定成功，正在載入會員資料...";
        checkMember();
      } else {
        bindStatus.innerHTML = "❌ 綁定失敗，請確認名稱是否正確。";
      }
    }

    async function loadOrders(mode) {
      const ordersArea = document.getElementById("ordersArea");
      const ordersInfo = document.getElementById("ordersInfo");
    
      ordersArea.style.display = "block";
      ordersInfo.innerHTML = "載入訂單中...";
    
      const res = await fetch("/api/get-orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          customer_name: currentCustomerName
        })
      });
    
      const result = await res.json();
    
      if (!result.success) {
        ordersInfo.innerHTML = "❌ 訂單讀取失敗。";
        return;
      }
    
      let orders = result.orders;
    
      if (mode === "unreturned") {
        orders = orders.filter(order => !order.is_returned);
      }
    
      if (orders.length === 0) {
        ordersInfo.innerHTML = "目前查無符合條件的訂單。";
        return;
      }
    
      const arrivedOrders = orders.filter(order => order.is_arrived && !order.is_returned);
      const arrivedCount = arrivedOrders.length;
      const arrivedWeight = arrivedOrders.reduce((sum, order) => {
        return sum + Number(order.weight_kg || 0);
      }, 0);
    
      let html = `
        <div style="background:#fff3e8; padding:14px; border-radius:14px; margin-bottom:14px; line-height:1.8;">
          <b>📦 已到貨未運回統計</b><br>
          訂單數量：${arrivedCount} 件<br>
          重量總計：${arrivedWeight.toFixed(2)} kg
        </div>
      `;
    
      orders.forEach(order => {
        const arrived = order.is_arrived ? "✔ 已到貨" : "✘ 未到貨";
        const returned = order.is_returned ? "✔ 已運回" : "✘ 未運回";
    
        const orderDate = order.order_time
          ? new Date(order.order_time).toLocaleDateString("zh-TW")
          : "-";
        
        html += `
          <div class="order">
        
            <b>${order.platform || "未填平台"}</b><br>
        
            📋 訂單編號：${order.order_id}<br>
        
            📅 下單日期：${orderDate}<br>
        
            🚚 物流單號：${order.tracking_number || "—"}<br>
        
            💰 金額：${order.amount_rmb || 0} RMB<br>
        
            ⚖️ 重量：${order.weight_kg || 0} kg<br><br>
        
            <span class="badge">${arrived}</span>
            <span class="badge">${returned}</span>
        
          </div>
        `;
      });
    
      ordersInfo.innerHTML = html;
    }

    main();
  </script>
</body>
</html>
